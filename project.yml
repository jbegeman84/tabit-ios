name: Tabit

options:
  bundleIdPrefix: com.jbegeman
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  TabitPackage:
    path: .

settings:
  base:
    SWIFT_VERSION: 6.0
    DEVELOPMENT_LANGUAGE: en

targets:
  Tabit:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: TabitPackage
        product: TabitFormat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jbegeman.tabit
        PRODUCT_NAME: Tabit
        INFOPLIST_FILE: App/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        ASSETCATALOG_COMPILER_APPICON_NAME: ""

schemes:
  Tabit:
    build:
      targets:
        Tabit: all
    run:
      config: Debug
    archive:
      config: Release
